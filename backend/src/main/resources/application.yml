spring:
  application:
    name: logitrack-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/logitrack}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  web:
    error:
      include-message: always

jwt:
  expiration-ms: 7200000
  secret: ${JWT_SECRET:x7Kp9mN2vQ8sL4tYzR1aBcDeFgHiJkLmNoPqRsTuVw}

app:
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}

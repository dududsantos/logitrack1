services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: logitrack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d logitrack"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/logitrack
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: x7Kp9mN2vQ8sL4tYzR1aBcDeFgHiJkLmNoPqRsTuVw
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
